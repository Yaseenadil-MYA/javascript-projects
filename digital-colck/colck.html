<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Digital Clock</title>
    <link rel="stylesheet" href="clock.css">
</head>
<body>
    <main class="clock-page">
        <section class="clock-card">
            <div class="clock-header">
                <span class="label">Modern Digital Clock</span>
                <span class="subtext">Live time with elegant glass UI</span>
            </div>
            <div class="clock-body">
                <span id="clock">00:00:00 PM</span>
                <span id="date">Loading date...</span>
            </div>
        </section>
    </main>

    <script src="clock.js"></script>
</body>
</html>
