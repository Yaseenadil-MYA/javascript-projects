<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stopwatch.css">
    <title>Stopwatch</title>
</head>
<body>
    <div class="page-shell">
        <section class="stopwatch">
            <div class="stopwatch-header">
                <span class="subtitle">Live timer</span>
                <h1>Stopwatch</h1>
            </div>
            <div class="time-display">00 : 00 : 00</div>
            <div class="buttons">
                <button id="stopbtn" class="btn" style="--clr:#ef4444">Stop</button>
                <button id="startbtn" class="btn" style="--clr:#22c55e">Start</button>
                <button id="resetbtn" class="btn" style="--clr:#3b82f6">Reset</button>
            </div>
        </section>
    </div>
    <script src="stopwatch.js"></script>
</body>
</html>
